name: license-boundaries

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-map-markers.txt
      - run: python3 -m pip install -r tools/requirements-map-markers.txt
      - run: python3 tools/check-license-boundaries.py
      - run: python3 tools/build-map-city-markers.py --check
      - run: python3 tools/test-map-city-markers.py
      - run: python3 tools/assets/build_ui_icons.py --check
      - run: python3 -m unittest tools.assets.test_build_ui_icons
      - run: python3 tools/assets/build_ui_illustrations.py --check
      - run: python3 -m unittest tools.assets.test_build_ui_illustrations
      - run: python3 tools/assets/build_regional_city_icons.py metropolitan central-plain hebei east-coast northern-frontier liangzhou jingzhou jiangdong sichuan lingnan --palette assets/city-icons/palette.json --check
      - run: python3 -m unittest discover -s tools/assets -p test_build_regional_city_icons.py
